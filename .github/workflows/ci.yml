# Checks every push and pull request: the backend builds, passes its lint and tests
# (unit, then end-to-end against a real PostgreSQL), and the frontend lints and builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, build, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # npm install, not npm ci: the backend lockfile misses a peer (typescript 5.9.3)
      # that npm now requires. Back to npm ci once `npm install` is run and the lockfile committed.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

  backend-e2e:
    name: Backend (end-to-end tests)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: herb_store_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/herb_store_ci?schema=public
      # Throwaway value for the test database only; production uses its own secret.
      AUTH_SECRET: 7f3c9a1e5b2d8c4f6a0e9d3b7c1f5a2e8d4c6b0a9f3e7d1c5b2a8f4e6d0c9b3a
      FRONTEND_ORIGIN: http://localhost:3000
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # npm install, not npm ci: the backend lockfile misses a peer (typescript 5.9.3)
      # that npm now requires. Back to npm ci once `npm install` is run and the lockfile committed.
      - run: npm install --no-audit --no-fund
      - name: Apply migrations to the empty test database
        run: npx prisma db migrate
      - run: npm run test:e2e

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
