# One-off: formats the code with Prettier on this branch and commits the result.
# Removed right after it has run.
name: Format once

on:
  push:
    branches: [phase-4e-prettier]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prettier (frontend)
        working-directory: frontend
        run: npx --yes prettier@3.9.6 --write "src/**/*.{ts,tsx,css}" next.config.ts eslint.config.mjs
      - name: Prettier (backend)
        working-directory: backend
        run: npx --yes prettier@3.9.6 --write "src/**/*.ts" "test/**/*.ts"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend backend
          git diff --cached --quiet || git commit -m "Mise en forme du code avec Prettier 3.9.6"
          git push
