# One-off: Prettier on this branch, then commit. Removed right after it has run.
name: Format once
on:
  push:
    branches: [textes-recettes]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - working-directory: frontend
        run: for pass in 1 2; do npx --yes prettier@3.9.6 --write "src/**/*.{ts,tsx,css}" > /dev/null; done
      - working-directory: backend
        run: for pass in 1 2 3; do npx --yes prettier@3.9.6 --write "src/**/*.ts" "test/**/*.ts" > /dev/null; done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend backend
          git diff --cached --quiet || git commit -m "Mise en forme Prettier"
          git push
